# Сценарий «Час пик»: в пиковые периоды спрос примерно в 2 раза выше пропускной способности.
name: "Час пик: спрос ×2"
seed: 42
time_scale: 20                  # 1 секунда реального времени = 20 секунд модельного
tick_hz: 2                      # частота телеметрии (Гц)
duration_h: 24                  # длина генерируемого графика, мин 1 сутки
base_rate_per_h:                # базовая интенсивность прибытия по категориям
  pass: 3.0
  freight_transit: 5.0
  freight_local: 1.2
peaks:                          # пики: множитель интенсивности
  - {start_h: 0.5, end_h: 2.5, factor: 2.0}
  - {start_h: 5.0, end_h: 6.5, factor: 2.2}
  - {start_h: 10.0, end_h: 12.0, factor: 2.0}
arrival_jitter_min: [-4, 12]    # фактическое опоздание/нагон относительно графика
initial_occupied: 6             # сколько путей заняты в момент старта
noise:                          # «грязный» канал, чтобы показать обработку потока
  position_sigma_m: 60
  duplicate_prob: 0.05
  malformed_prob: 0.01
