# Интегральный индекс состояния станции: I = 100 · Σ w_k · s_k, где s_k ∈ [0, 1].
# Веса нормируются автоматически (делятся на сумму). Значения по умолчанию;
# admin может переопределить их через UI или PUT /config/index без перезапуска.
factors:
  throughput:
    name: "Пропускная способность"
    weight: 0.25
    description: "Отправлено поездов за последний час к числу поездов, которые к этому часу должны были уйти"
  deviation:
    name: "Отклонение от графика"
    weight: 0.20
    worst_min: 40               # при среднем отклонении ≥ 40 мин оценка = 0
    description: "Среднее отклонение фактического отправления от графика, мин"
  utilization:
    name: "Загрузка путей"
    weight: 0.15
    optimal: [0.55, 0.85]       # «колокол»: в этом диапазоне оценка = 1
    description: "Доля занятых открытых путей; штраф и за простой путей, и за переполнение"
  conflicts:
    name: "Конфликты маршрутов"
    weight: 0.15
    worst_count: 8
    description: "Неразрешённые конфликты: пересечения маршрутов, занятые пути, нехватка ресурсов"
  resource_idle:
    name: "Простой ресурсов"
    weight: 0.10
    worst_min: 30
    description: "Простой локомотивов и бригад: среднее ожидание поездом локомотива/бригады, мин"
  queue:
    name: "Очередь на подходе"
    weight: 0.15
    worst_min: 45
    description: "Среднее ожидание приёма поездами на подходе и у входного сигнала, мин"

categories:                     # пороги категорий состояния
  - {id: norm,     name: "Норма",    min: 75, color: "#2fbf71", reason: "Станция работает по графику, резерв пропускной способности есть"}
  - {id: warning,  name: "Внимание", min: 50, color: "#f5a524", reason: "Растут очередь и отклонения от графика, нужны решения диспетчера"}
  - {id: critical, name: "Критично", min: 0,  color: "#f04438", reason: "Станция перегружена: поезда простаивают, график срывается"}

grades:                         # буквенная шкала A–E
  - {grade: A, min: 85}
  - {grade: B, min: 70}
  - {grade: C, min: 55}
  - {grade: D, min: 40}
  - {grade: E, min: 0}
