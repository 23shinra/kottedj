id: redundancy
order: 9
name: "9. Горячий резерв УВК (по мотивам фото)"
description: >
  В 08:30 отказывает комплект УВК-2.1 поста ЭЦ-2: работа продолжается на резервном УВК-2.2.
  В 08:50 отказывает и УВК-2.2: стрелки восточной горловины теряют контроль, сигналы гаснут,
  рельсовые цепи показывают занятость. Движение через восточную горловину останавливается до
  восстановления хотя бы одного комплекта.
