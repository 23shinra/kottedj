# Демонстрационный расчёт допустимой массы состава (по мотивам Правил тяговых расчётов, упрощённо).
traction_calc:
  passenger_mass_t: 0.1
  # основное удельное сопротивление, Н/кН (= кгс/тс):
  #   локомотив в режиме тяги:     w0' = a + b·v + c·v²
  #   4-осный грузовой на роликах: w0'' = 0.7 + (3 + 0.1·v + 0.0025·v²) / q0, q0 — масса на ось, т
  #   пассажирский вагон:          w0'' = 1.2 + 0.012·v + 0.0002·v²
  loco_w0: [1.9, 0.01, 0.0003]
