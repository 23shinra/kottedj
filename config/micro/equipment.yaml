# Техническое оборудование микропроцессорной централизации (по мотивам docs/source/equipment_scheme.png).
#
# На фото: три кластера в кольцах ЛВС; в каждом «Пост управления», «Модуль ЭЦ-ТМ2», шкафы ТО и УВК,
# под ними — пары комплектов УВК (на баннере стенда — «полное горячее резервирование»), панель питания
# с фидерами «1Ф / 2Ф». Точные подписи модулей не читаются — обозначения ниже демонстрационные.
#
# По этому описанию генератор строит граф зависимостей (shared/dstation/micro/equipment.py):
#   Фидер Ф1 | Ф2 → ПП-k (панель питания поста)
#   ПП-k → УВК-k.1, УВК-k.2 (горячий резерв)   ПП-k → ЛВС-k (коммутатор)
#   (УВК-k.1 | УВК-k.2) & ЛВС-k & ПП-k → модуль ЭЦ
#   модуль ЭЦ → кабельная муфта → стрелочный электропривод / светофор
#   модуль ЭЦ → рельсовая цепь участка
#
# «Муфты» (из устного описания): на фото их нет. Допущение — кабельные муфты на линии
# «модуль ЭЦ — привод/светофор». Отказ муфты = потеря контроля положения стрелки или погашенный сигнал.
feeders:
  - {id: "Ф1", name: "Фидер питания Ф1"}
  - {id: "Ф2", name: "Фидер питания Ф2"}

posts:
  - id: "1"
    name: "Пост ЭЦ-1 · западная горловина 1520"
    modules:
      - {id: "М1.1", name: "Модуль ЭЦ-ТМ2 М1.1 (стрелки 1–5)",   switches: ["1", "3", "5"],  signals: ["Н", "ЧI", "Ч2", "Ч3"]}
      - {id: "М1.2", name: "Модуль ЭЦ-ТМ2 М1.2 (стрелки 7–11)",  switches: ["7", "9", "11"], signals: ["Ч4", "Ч5", "Ч6", "Ч7П"]}
      - {id: "М1.3", name: "Модуль ЭЦ-ТМ2 М1.3 (рельсовые цепи)", track_circuits: ["ЗП", "1СП", "1-3", "1-5", "3-I", "3-2", "5-3", "5-7", "7-4", "7-9", "9-5", "9-11", "11-6", "11-7П", "I", "2", "3", "7П"]}
  - id: "2"
    name: "Пост ЭЦ-2 · восточная горловина 1520"
    modules:
      - {id: "М2.1", name: "Модуль ЭЦ-ТМ2 М2.1 (стрелки 2–6)",   switches: ["2", "4", "6"], signals: ["Ч", "НI", "Н2", "Н3"]}
      - {id: "М2.2", name: "Модуль ЭЦ-ТМ2 М2.2 (стрелки 8–10)",  switches: ["8", "10"],     signals: ["Н4", "Н5", "Н6"]}
      - {id: "М2.3", name: "Модуль ЭЦ-ТМ2 М2.3 (рельсовые цепи)", track_circuits: ["ВП", "2СП", "4-2", "6-2", "I-4", "2-4", "3-6", "8-6", "4-8", "10-8", "5-10", "6-10", "4", "5", "6"]}
  - id: "3"
    name: "Пост ЭЦ-3 · парк 1435"
    modules:
      - {id: "М3.1", name: "Модуль ЭЦ-ТМ2 М3.1 (стрелки 12–16)", switches: ["12", "14", "16"], signals: ["ЧК", "Н1К", "Н2К", "Н3К", "Н4КП"]}
      - {id: "М3.2", name: "Модуль ЭЦ-ТМ2 М3.2 (рельсовые цепи)", track_circuits: ["ВП-К", "12СП", "14-12", "16-12", "1К-14", "4КП-14", "2К-16", "3К-16", "1К", "2К", "3К", "4КП"]}

# Время подтверждения контроля положения стрелки после восстановления управления, с.
control_confirm_s: 10

# Типовые неисправности, доступные для внесения (kind устройства → варианты).
fault_kinds:
  switch_drive:  ["механическая неисправность электропривода", "взрез стрелки (не подтверждено положение)"]
  coupling:      ["обрыв жилы в кабельной муфте", "замыкание в кабельной муфте"]
  signal_unit:   ["перегорание нити лампы", "отказ светофорного блока"]
  track_circuit: ["ложная занятость рельсовой цепи"]
  ec_module:     ["отказ модуля ЭЦ-ТМ2"]
  uvk:           ["отказ комплекта УВК"]
  lan_switch:    ["отказ коммутатора ЛВС"]
  power_panel:   ["отказ панели питания"]
  feeder:        ["отключение фидера"]
